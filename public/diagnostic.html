<!DOCTYPE html>
<html>

<head>
    <title>Bike Diagnostic</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        canvas {
            border: 1px solid #222;
        }

        .label {
            color: #0ff;
            font-family: monospace;
            padding: 4px 8px;
            position: absolute;
            font-size: 12px;
            text-shadow: 0 0 4px #0ff;
        }
    </style>
</head>

<body>
    <div style="position: relative;">
        <div class="label">SIDE</div><canvas id="side" width="500" height="400"></canvas>
    </div>
    <div style="position: relative;">
        <div class="label">3/4 (CONCEPT ANGLE)</div><canvas id="quarter" width="500" height="400"></canvas>
    </div>
    <div style="position: relative;">
        <div class="label">CONCEPT</div>
        <img src="/rider_3d_concept.png" width="500" height="400"
            style="object-fit:contain;border:1px solid #222;background:#080c14;">
    </div>
    <script
        type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js"}}</script>
    <script type="module">
        import * as THREE from 'three';

        const WR = 0.34;
        const rearHub = [0, WR, 0.48], frontHub = [0, WR, -0.48];
        const bb = [0, 0.32, 0.05], seatTop = [0, 0.80, 0.22], headTop = [0, 0.76, -0.33];
        const seatPos = [0, 0.83, 0.22], barPos = [0, 0.74, -0.40];

        function makeTube(scene, from, to, r, mat) {
            const d = new THREE.Vector3(to[0] - from[0], to[1] - from[1], to[2] - from[2]);
            const len = d.length();
            const geo = new THREE.CylinderGeometry(r, r, len, 8);
            const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
            geo.applyQuaternion(q);
            const mid = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2, (from[2] + to[2]) / 2];
            geo.translate(...mid);
            scene.add(new THREE.Mesh(geo, mat));
        }

        function makeWheel(scene, pos, mats) {
            const g = new THREE.Group();
            g.position.set(...pos);
            const orient = new THREE.Group();
            orient.rotation.set(0, Math.PI / 2, 0);
            orient.add(new THREE.Mesh(new THREE.TorusGeometry(WR, 0.022, 16, 48), mats.tire));
            orient.add(new THREE.Mesh(new THREE.TorusGeometry(WR - 0.015, 0.008, 8, 48), mats.rim));
            orient.add(new THREE.Mesh(new THREE.TorusGeometry(WR - 0.015, 0.04, 8, 48), mats.halo));
            for (let i = 0; i < 12; i++) {
                const s = new THREE.Mesh(new THREE.CylinderGeometry(0.0015, 0.0015, WR * 2 - 0.05, 3), mats.spoke);
                s.rotation.z = i * Math.PI / 6;
                orient.add(s);
            }
            orient.add(new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.04, 8), mats.frameDark));
            g.add(orient);
            scene.add(g);
        }

        function buildBike(scene) {
            const mats = {
                frame: new THREE.MeshStandardMaterial({ color: 0x2a3a4a, metalness: 0.75, roughness: 0.25, emissive: 0x00e5ff, emissiveIntensity: 0.06 }),
                frameDark: new THREE.MeshStandardMaterial({ color: 0x1e2d3d, metalness: 0.7, roughness: 0.3 }),
                tire: new THREE.MeshStandardMaterial({ color: 0x0a0a14, roughness: 0.95 }),
                rim: new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x00e5ff, emissiveIntensity: 2.5, metalness: 0.95, roughness: 0.05 }),
                halo: new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.2, depthWrite: false }),
                spoke: new THREE.MeshStandardMaterial({ color: 0x556677, metalness: 0.8 }),
                seat: new THREE.MeshStandardMaterial({ color: 0x111120, roughness: 0.9 }),
                bar: new THREE.MeshStandardMaterial({ color: 0x1a2535, metalness: 0.85 }),
                chain: new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.9 }),
            };

            makeWheel(scene, rearHub, mats);
            makeWheel(scene, frontHub, mats);

            // Frame triangle
            makeTube(scene, bb, seatTop, 0.013, mats.frame);
            makeTube(scene, seatTop, headTop, 0.011, mats.frame);
            makeTube(scene, headTop, bb, 0.013, mats.frame);
            makeTube(scene, seatTop, rearHub, 0.006, mats.frameDark);
            makeTube(scene, bb, rearHub, 0.006, mats.frameDark);
            makeTube(scene, headTop, frontHub, 0.008, mats.frame);

            // Handlebar + stem
            makeTube(scene, headTop, barPos, 0.008, mats.bar);
            const bar = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.01, 0.04), mats.bar);
            bar.position.set(...barPos);
            scene.add(bar);

            // Saddle
            const saddle = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.018, 0.16), mats.seat);
            saddle.position.set(...seatPos);
            scene.add(saddle);
            makeTube(scene, seatTop, seatPos, 0.008, mats.frameDark);

            // Chainring
            const cr = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.004, 6, 24), mats.chain);
            cr.position.set(...bb); cr.rotation.y = Math.PI / 2;
            scene.add(cr);

            // Ground glow
            const gc = document.createElement('canvas'); gc.width = 128; gc.height = 128;
            const gctx = gc.getContext('2d');
            const grad = gctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(0,229,255,0.5)'); grad.addColorStop(0.35, 'rgba(0,229,255,0.18)');
            grad.addColorStop(1, 'rgba(0,229,255,0)'); gctx.fillStyle = grad; gctx.fillRect(0, 0, 128, 128);
            const glow = new THREE.Mesh(
                new THREE.PlaneGeometry(2.5, 2.5),
                new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, depthWrite: false })
            );
            glow.rotation.x = -Math.PI / 2; glow.position.y = 0.01;
            scene.add(glow);
        }

        function render(canvasId, camPos, lookAt) {
            const canvas = document.getElementById(canvasId);
            const r = new THREE.WebGLRenderer({ canvas, antialias: true });
            r.setSize(500, 400); r.setClearColor(0x060a12);
            r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.3;
            const scene = new THREE.Scene();
            scene.add(new THREE.AmbientLight('#8badcc', 0.4));
            const dl = new THREE.DirectionalLight('#5de0ff', 0.5); dl.position.set(5, 15, 10); scene.add(dl);
            const pl = new THREE.PointLight('#00e5ff', 0.8, 3); pl.position.set(0, 0.35, 0); scene.add(pl);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: '#0d1117' }));
            ground.rotation.x = -Math.PI / 2; scene.add(ground);
            scene.add(new THREE.GridHelper(10, 40, 0x003344, 0x001a1a));
            buildBike(scene);
            const cam = new THREE.PerspectiveCamera(45, 500 / 400, 0.1, 50);
            cam.position.set(...camPos); cam.lookAt(new THREE.Vector3(...lookAt));
            r.render(scene, cam);
        }

        render('side', [2.5, 0.8, 0], [0, 0.45, 0]);
        render('quarter', [1.2, 1.5, 3], [-0.1, 0.4, -0.5]);
    </script>
</body>

</html>
